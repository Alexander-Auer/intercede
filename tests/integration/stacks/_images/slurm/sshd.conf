# Only the test user, and only with the key the entrypoint creates.
AllowUsers dirac
AuthenticationMethods publickey
HostKey /etc/ssh/ssh_host_ed25519_key
# Whether PAM lets a login through depends on the machine the container runs on: it worked here
# and was refused on GitHub's runners. The key above is all this login needs.
UsePAM no
# Every connection comes from the same address, Docker's gateway, and the tests log in with wrong
# keys on purpose: a penalty would refuse the tests that follow.
PerSourcePenalties no
