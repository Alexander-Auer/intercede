# Backend half of the `basic` configuration, shared by the `ssh-slurm` and `local-slurm` stacks.
# Changes together with their intercede-client.toml (integration-stacks.md, rule 7).
ClusterName=intercede
SlurmctldHost=backend
SlurmUser=slurm
AuthType=auth/munge

StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/d
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid

# No Slurm*LogFile: the daemons run with -D, which logs to stdout (integration-stacks.md, rule 4).

# Inside a container: no cgroup-based process tracking or task confinement.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

SelectType=select/cons_tres
SelectTypeParameters=CR_Core

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
JobAcctGatherType=jobacct_gather/none

# Forget finished jobs soon, so a suite run also reads them from `sacct`, as on a busy site where
# the default of 5 minutes passes between two polls.
MinJobAge=10

# Fixed resources, believed whatever the machine has, so the cluster looks the same on a laptop and
# on a CI runner. Enough for the suite's parallel workers; the jobs themselves barely use a CPU.
SlurmdParameters=config_overrides
ReturnToService=2
NodeName=backend CPUs=8 RealMemory=8000 State=UNKNOWN
PartitionName=test Nodes=ALL Default=YES MaxTime=INFINITE State=UP
