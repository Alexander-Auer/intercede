# Client half of the `basic` configuration. See docs/dev/reference/integration-stacks.md
# The backend half is the pool of stacks/htcondor (its image's pool.conf): nothing to add.

[stack]
id = "local-htcondor" # this stack's id in stacks.yml

[backend]
kind = "batch"
transport = "local"
scheduler = "htcondor"
# No [credentials]: pytest runs in the container, as the user the jobs run as, and the schedd
# trusts a user of its own host.

[refusals]
# What this backend cannot honour; the shared suite checks it is refused at submit.
containers = true  # no container_launcher configured above
url_inputs = true  # the composed backend has no data mover of its own
url_outputs = true
