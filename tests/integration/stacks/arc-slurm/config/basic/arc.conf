# Backend half of the `basic` configuration: mounted into the CE as /etc/arc.conf. Changes together
# with intercede-client.toml (integration-stacks.md, rule 7).

[common]
# The name the harness reaches the CE by: its certificate is for it, and the test token issuer is
# named after it (entrypoint.sh).
hostname = localhost
x509_host_key = /etc/grid-security/hostkey.pem
x509_host_cert = /etc/grid-security/hostcert.pem
x509_cert_dir = /etc/grid-security/certificates

# Clients authenticate with a token from arcctl's test issuer, whose keys the entrypoint makes at
# every start. Its name is fixed: https://<hostname>/arc/testjwt/<CRC32 of the hostname>.
[authgroup: intercede]
authtokens = * https://localhost/arc/testjwt/9ec20823 * * *

[mapping]
map_to_user = intercede dirac:dirac

[lrms]
lrms = slurm
slurm_bin_path = /usr/bin
# The cluster keeps no accounting (slurm.conf): finished jobs are read with scontrol.
slurm_use_sacct = no

[arex]
logfile = /dev/stdout

[arex/ws]
# The REST interface, published on the host under the same address (compose.yml).
wsurl = https://localhost:8443/arex
logfile = /dev/stdout

[arex/ws/jobs]
allowaccess = intercede

[infosys]
logfile = /dev/stdout

[infosys/glue2]

[infosys/cluster]

# The cluster's one partition (slurm.conf).
[queue: test]
