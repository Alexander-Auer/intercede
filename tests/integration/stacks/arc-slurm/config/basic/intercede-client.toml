# Client half of the `basic` configuration. See docs/dev/reference/integration-stacks.md
# Changes together with arc.conf, the backend half (rule 7).

[stack]
id = "arc-slurm" # this stack's id in stacks.yml

[backend]
kind = "arc"
# A-REX's REST interface, published on the host (compose.yml) and advertised under this URL
# (arc.conf). Its certificate is for localhost, from the test CA in ca.pem.
endpoint = "https://localhost:8443/arex"
# No `queue`: the CE sends a job to its one queue, `test`, when the job names none.

[credentials]
type = "token"                  # a token from arcctl's test issuer, which arc.conf lets in
path = "credentials/arc-slurm/" # holds `token` and `ca.pem`, made at every container start

[refusals]
# What this backend cannot honour; the shared suite checks it is refused at submit.
containers = true # no container_launcher configured above
