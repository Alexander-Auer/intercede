# The cluster behind the CE: mounted as /etc/slurm/slurm.conf. Changes together with arc.conf and
# intercede-client.toml (integration-stacks.md, rule 7).
#
# Not shared with the Slurm stacks (stacks/slurm/config/basic/slurm.conf) on purpose. It is the same
# cluster except for two lines:
# - No accounting. Theirs uses slurmdbd, which needs a database that this image does not run.
# - No MinJobAge=10. Theirs makes Slurm forget a finished job after 10 seconds, so that their tests
#   must read it from sacct. Without accounting, ARC reads finished jobs with scontrol instead
#   (arc.conf), so Slurm must remember them for the default 5 minutes.
# Keeping two files also means that a change made for the Slurm stacks cannot change this one.
ClusterName=intercede
SlurmctldHost=backend
SlurmUser=slurm
AuthType=auth/munge

StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/d
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid

# No Slurm*LogFile: the daemons run with -D, which logs to stdout (integration-stacks.md, rule 4).

# Inside a container: no cgroup-based process tracking or task confinement.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# No accounting: A-REX reads a finished job's result from the job itself, not from Slurm.
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none

# Fixed resources, believed whatever the machine has, so the cluster looks the same on a laptop and
# on a CI runner. Enough for the suite's parallel workers; the jobs themselves barely use a CPU.
SlurmdParameters=config_overrides
ReturnToService=2
NodeName=backend CPUs=8 RealMemory=8000 State=UNKNOWN
PartitionName=test Nodes=ALL Default=YES MaxTime=INFINITE State=UP
